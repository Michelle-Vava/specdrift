name: test

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo
      - name: built CLI exits 1 on breaking changes
        run: |
          set +e
          node dist/cli.js examples/plant-shop-v1.json examples/plant-shop-v2.json
          test $? -eq 1
      - name: Show tests and demo on the run page
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        env:
          NO_COLOR: 1
        run: |
          {
            echo '## Tests'
            echo '```'
            node --test --test-reporter=spec "test/*.test.ts"
            echo '```'
            echo '## Demo: plant shop API v1 → v2'
            echo '```'
            npm run demo --silent
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
